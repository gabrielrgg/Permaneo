<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f9f8" />
    <link rel="icon" type="image/svg+xml" href="/src/imagens/logo.svg" />
    <meta name="description" content="Permaneo — acompanhamento escolar para apoiar a permanência dos estudantes." />
    <title>Permaneo · Site e protótipo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      try {
        const theme = localStorage.getItem('permaneo-theme') === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"><p style="padding:24px;font-family:Arial,sans-serif">Carregando Permaneo…</p></div>
    <noscript>Ative o JavaScript no navegador para abrir o Permaneo.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
